name: Release

# 发布第一阶段（issue #32 / #17）：编译同 SHA 的双端产物 → 正式代码签名 → 生成
# DMG/EXE/MSI + 各自 SHA-256 → 写进**未发布草稿**，到此为止。
#
# 为什么这里不发布：应用内更新用离线 Ed25519 私钥签名（issue #17），私钥必须留在维护者的可信机器上。
# 本工作流刻意**不读取、不存储**任何 Ed25519 私钥，因此不具备发布未签名更新的能力；草稿缺少
# 清单签名 `.update.json.ed25519.sig` 是预期状态，由维护者离线签名后，用 .github/workflows/finalize.yml 严格校验再发布。
# 普通推送与 PR 只跑 ci.yml（只读），不会走到这里。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要编译并放入草稿的 tag（例如 v1.0.7，必须与 VERSION 一致；本工作流只产草稿不发布）"
        required: true
        type: string

# 只有写草稿的 stage-draft 需要写仓库权限；actions: write 仅用于上传 camera-bin 构建产物。
permissions:
  contents: read
  actions: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    # 发布门禁：tag 必须等于 v$(VERSION)，必须指向当前 HEAD，Windows 侧三处版本号必须一致。
    # 发布工作流从不创建 tag；tag 不存在或指向别的提交时直接失败。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag, VERSION, commit, and Windows version metadata
        id: check
        env:
          # 通过 env 传值，避免把 workflow_dispatch 输入直接拼进 shell 脚本。
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: bash scripts/check_release.sh tag "$REQUESTED_REF"

      - name: Fail fast if the tag already has a public release
        # 发布工作流从不覆盖已发布的 release；在这里先失败，省掉两端一个多小时的构建。
        # 只有 draft 在读权限下不可见，会落到“没有 release”这一支，发布 job 再做权威判断。
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! release="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "✅ $tag 还没有 release，可以继续"
            exit 0
          fi
          if [ "$release" = "true" ]; then
            echo "✅ $tag 只有 draft，发布 job 会在附件校验后复用"
            exit 0
          fi
          {
            echo "### ❌ ${tag} 已有已发布的 release"
            echo "本工作流不会用 --clobber 覆盖已发布附件。请升版本号（VERSION + 三处 Windows 版本元数据）后重新打 tag；"
            echo "确实要重发同一版本时，先人工删除该 release 再重跑。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "❌ ${tag} 已存在已发布的 release；拒绝覆盖。" >&2
          exit 1

  camera-bin:
    # 与 CI 共用同一份 go2rtc / 最小 ffmpeg 构建，安装包内置 (#200)。
    uses: ./.github/workflows/camera-bin.yml

  macos-release:
    # 签名依赖 macOS 工具链。本工作流只做固定证书代码签名（并写入证书 SHA-1 pin）；
    # Apple 公证需要额外凭据，未包含在此流程中（需要公证时在本地按 scripts/release.sh 的说明执行）。
    # 更新包所需的 Ed25519 签名由维护者离线完成，本 job 不接触私钥。
    # 只产出 artifact；发布动作一律由 .github/workflows/finalize.yml 在离线签名后执行。
    needs: verify-tag
    runs-on: macos-26
    timeout-minutes: 90
    # 来源证明（#170）只需要 OIDC 与 attestations 写权限；构建仍然只读仓库。
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      - name: Toolchain info
        run: xcodebuild -version && swift --version

      - name: Install ripgrep
        run: bash scripts/install_ripgrep.sh

      - name: Require a pinned macOS signing certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${MACOS_SIGNING_P12:-}" ] && [ -n "${MACOS_SIGNING_P12_PASSWORD:-}" ]; then
            echo "✅ 已配置 MACOS_SIGNING_P12 / MACOS_SIGNING_P12_PASSWORD"
            exit 0
          fi
          # 更新校验钉住 Info.plist 的 MijiaCodeSignCertSHA1；ad-hoc 包没有这张证书，
          # fail-closed 之后既装不上更新、也无法被后续版本信任，发出去就是把用户锁死在旧版。
          {
            echo "### ❌ 缺少 MACOS_SIGNING_P12 / MACOS_SIGNING_P12_PASSWORD，已拒绝发布"
            echo "发布包必须用固定证书签名并把证书 SHA-1 写进 App（更新校验依赖它）。ad-hoc 签名不再作为发布降级路径；"
            echo "本机自用请直接执行 \`bash scripts/build_app.sh\`。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "❌ 缺少 macOS 代码签名证书：发布必须带固定签名身份与证书 SHA-1 pin（ADR-0005）；ad-hoc 不发布。" >&2
          exit 1

      - name: Import macOS signing certificate
        id: signing
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/menubarmijia-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          umask 077
          printf '%s' "$MACOS_SIGNING_P12" | tr -d '[:space:]' | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"

          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1 || true)"
          if [ -z "$identity" ]; then
            # 自签名证书在建立信任前可能不出现在 find-identity 里，退回到证书 CN。
            identity="$(security find-certificate -a -p "$keychain" \
              | openssl x509 -noout -subject -nameopt multiline 2>/dev/null \
              | awk -F' = ' '/commonName/ { print $2; exit }' || true)"
          fi
          if [ -z "$identity" ]; then
            echo "❌ 导入 p12 后没有找到可用的 codesigning 身份" >&2
            exit 1
          fi
          security find-certificate -c "$identity" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          if ! openssl x509 -in "$RUNNER_TEMP/signing.pem" -noout -issuer | grep -q "Apple"; then
            # 自签名证书通常需要显式信任才能构建签名链；失败不阻断，后续 codesign 会给出明确错误。
            if ! sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"; then
              echo "::warning::无法把自签名证书加入系统信任；如果 codesign 失败，请改用已受信任的证书。"
            fi
          fi
          sha1="$(security find-identity -v -p codesigning "$keychain" | awk -v id="$identity" 'index($0, id) { print $2; exit }' | tr 'A-F' 'a-f' || true)"
          if ! printf '%s' "$sha1" | grep -Eq '^[0-9a-f]{40}$'; then
            sha1="$(security find-certificate -c "$identity" -p "$keychain" \
              | openssl x509 -noout -fingerprint -sha1 2>/dev/null \
              | sed 's/^.*=//' \
              | tr -d ':' \
              | tr 'A-F' 'a-f' || true)"
          fi
          if ! printf '%s' "$sha1" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "❌ 无法读取签名证书 SHA-1" >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "sha1=$sha1" >> "$GITHUB_OUTPUT"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_CERT_SHA1=$sha1" >> "$GITHUB_ENV"
          echo "✅ 已导入签名身份：$identity ($sha1)"

      - name: Verify signing identity and pinned SHA-1 are usable
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          CERT_SHA1: ${{ steps.signing.outputs.sha1 }}
        run: |
          set -euo pipefail
          if [ -z "${IDENTITY:-}" ]; then
            echo "❌ 没有解析出代码签名身份；发布包必须用固定证书签名。" >&2
            exit 1
          fi
          if ! printf '%s' "${CERT_SHA1:-}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "❌ 证书 SHA-1 不是 40 位十六进制（当前：${CERT_SHA1:-<空>}）；空 pin 会让更新校验拒绝所有后续版本。" >&2
            exit 1
          fi
          echo "✅ 签名身份与证书 pin 就绪：$IDENTITY ($CERT_SHA1)"

      - name: Match the maintainer's region
        # 温度单位跟随系统区域。托管机默认美国区（华氏度），测试的基准是中国区。
        run: |
          defaults write -g AppleLocale zh_CN
          defaults write -g AppleMetricUnits -bool true
          defaults write -g AppleMeasurementUnits Centimeters
          defaults write -g AppleTemperatureUnit Celsius

      - name: Lint, test, sign, and build DMG
        env:
          DEVELOPER_ID: ${{ steps.signing.outputs.identity }}
          MACOS_CERT_SHA1: ${{ steps.signing.outputs.sha1 }}
          SKIP_NOTARIZE: "1"
          LC_ALL: C
        run: bash scripts/release.sh

      - name: Check macOS build outputs
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          # 只有 DMG、.sha256 与 SBOM：Ed25519 私钥不进 CI，签名必须由维护者在可信机器离线完成。
          for file in \
            "dist/MenuBarHome-${version}.dmg" \
            "dist/MenuBarHome-${version}.dmg.sha256"
          do
            if [ ! -s "$file" ]; then
              echo "❌ 缺少发布附件：$file" >&2
              exit 1
            fi
          done
          go2rtc_archs="$(lipo -archs "MenuBarHome.app/Contents/Resources/bin/go2rtc" 2>/dev/null || true)"
          if ! printf '%s' "$go2rtc_archs" | grep -qw "arm64" || ! printf '%s' "$go2rtc_archs" | grep -qw "x86_64"; then
            echo "❌ MenuBarHome.app 缺少通用架构 go2rtc 组件（当前：${go2rtc_archs:-<缺失>}，期望：arm64 + x86_64）" >&2
            exit 1
          fi
          if ! strings "MenuBarHome.app/Contents/Resources/bin/go2rtc" | grep -F "api/xiaomi/ptz" >/dev/null 2>&1 \
            || ! strings "MenuBarHome.app/Contents/Resources/bin/go2rtc" | grep -F "X-MenuBarMijia-PTZ" >/dev/null 2>&1; then
            echo "❌ MenuBarHome.app 内置 go2rtc 缺少 /api/xiaomi/ptz 云台补丁路由或版本头" >&2
            exit 1
          fi
          if [ -e "dist/MenuBarHome-${version}.dmg.ed25519.sig" ]; then
            echo "❌ CI 不应产出 Ed25519 签名：私钥必须留在可信机器上（issue #17）。" >&2
            exit 1
          fi
          echo "ℹ️ 本次构建未签名更新清单；发布前需在可信机器上执行 scripts/sign_update.swift --min-from <x.y.z>。"

      - name: Generate macOS SBOM (SPDX 2.3)
        # 扫描 DMG 里实际安装的 .app（含内置 go2rtc），产出随 release 一起附带的 SBOM（#170）。
        # 附件统一由 stage-draft 挂到草稿：这里关掉 action 自己的 artifact/release 上传，
        # 避免草稿还没创建时它去找 release（或额外多出一份 workflow artifact）。
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: MenuBarHome.app
          format: spdx-json
          output-file: dist/MenuBarHome-${{ needs.verify-tag.outputs.version }}-macos.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest DMG build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MenuBarHome-${{ needs.verify-tag.outputs.version }}.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: |
            dist/MenuBarHome-*.dmg
            dist/MenuBarHome-*.dmg.sha256
            dist/MenuBarHome-*.spdx.json
          if-no-files-found: error

  windows-release:
    # 编译 Windows 安装包并上传为 artifact（#32）。
    # Authenticode 签名需要证书，通过仓库 secrets 提供：
    #   WINDOWS_CERTIFICATE          base64 编码的 p12（含私钥）
    #   WINDOWS_CERTIFICATE_PASSWORD p12 密码
    # 可选仓库 variables（覆盖时间戳服务器，默认不签名时间戳）：
    #   WINDOWS_TIMESTAMP_URL        例如 http://timestamp.digicert.com
    #   WINDOWS_TIMESTAMP_TSP=true   服务商要求 RFC 3161 时开启
    # 未配置证书时安装包保持未签名：不会声称已签名，发布步骤会在 release notes 与 job summary
    # 中明确标注“未签名”，并保留 #32 的 SmartScreen 验收项为未完成。
    # 校验要求 Get-AuthenticodeSignature = Valid，因此证书必须由公开信任的 CA 签发（OV/EV 或
    # SignPath/Azure Trusted Signing）；自签名/内部 CA 会被判为 UnknownError，必须换正式证书。
    needs: [verify-tag, camera-bin]
    runs-on: windows-latest
    timeout-minutes: 60
    # 只给 Windows 构建 job 加来源证明所需权限（#170）。
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      signed: ${{ steps.authenticode.outputs.signed }}
    defaults:
      run:
        # windows-latest 默认是 PowerShell，收集附件/算校验和用的是 bash 语法，必须显式指定。
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "windows/src-tauri -> target"
          # 读 main 上 CI 存的 release 产物。tag 作用域的缓存别的 ref 都读不到，存了也是白占空间。
          shared-key: windows-release-build
          save-if: false

      - name: Read the Tauri CLI version for the tools cache key
        id: tauri-cli
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@tauri-apps/cli'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Same tools cache CI fills on main: NSIS 3.13 and WiX 3.14 from GitHub Releases. Release only
      # restores. continue-on-error: a cache outage has no business failing a release; a miss just
      # downloads the tools again inside the build step.
      - name: Restore the Tauri bundler tools cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-v1-${{ runner.os }}-${{ steps.tauri-cli.outputs.version }}

      - name: Install frontend & Tauri CLI dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: camera-bin
          path: windows/src-tauri/camera-bin

      - name: Import Authenticode certificate
        id: authenticode
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "signed=false"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "### ⚠️ Windows 安装包本次未签名"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "未配置 WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD，EXE/MSI 没有 Authenticode 签名；"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "用户安装时仍会被 SmartScreen 拦截（issue #32 的验收项），发布说明会明确标注。申请签名证书后重跑即可。"
            Write-Warning "未配置 Windows Authenticode 证书；安装包将保持未签名，不会被标记为已签名。"
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP 'authenticode.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          try {
            $imported = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure)
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # p12 里可能带中间证书；只挑“有私钥 + Code Signing EKU”的那张，正是 signtool 能用的身份。
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $cert = $imported | Where-Object {
            if (-not $_.HasPrivateKey) { return $false }
            $eku = $_.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } | Select-Object -First 1
            if (-not $eku) { return $false }
            return [bool]($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq $codeSigningOid })
          } | Select-Object -First 1
          if (-not $cert) {
            $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          }
          if (-not $cert -or -not $cert.Thumbprint) {
            Write-Error "导入 p12 后没有拿到带私钥的签名证书，无法签名"
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "thumbprint=$($cert.Thumbprint)"
          Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8 -Value "signed=true"
          Write-Host "✅ 已导入 Authenticode 证书：$($cert.Subject) ($($cert.Thumbprint))"

      - name: Build Windows installer (.exe & .msi)
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ steps.authenticode.outputs.thumbprint }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_TIMESTAMP_TSP: ${{ vars.WINDOWS_TIMESTAMP_TSP }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_CERT_THUMBPRINT:-}" ]; then
            echo "▶ 未配置 Authenticode 证书，构建未签名安装包"
            npx tauri build -- --locked
            exit 0
          fi
          if ! printf '%s' "$WINDOWS_CERT_THUMBPRINT" | grep -Eq '^[0-9A-Fa-f]{40}$'; then
            echo "❌ 证书指纹格式错误：$WINDOWS_CERT_THUMBPRINT" >&2
            exit 1
          fi
          config='{"bundle":{"windows":{"certificateThumbprint":"'"${WINDOWS_CERT_THUMBPRINT}"'","digestAlgorithm":"sha256"'
          if [ -n "${WINDOWS_TIMESTAMP_URL:-}" ]; then
            config="${config}"',"timestampUrl":"'"${WINDOWS_TIMESTAMP_URL}"'"'
            if [ "${WINDOWS_TIMESTAMP_TSP:-}" = "true" ]; then
              config="${config}"',"tsp":true'
            fi
          else
            echo "::warning::未设置 WINDOWS_TIMESTAMP_URL，安装包签名不带时间戳，证书到期后签名将失效。"
          fi
          close='}}}'
          config="${config}${close}"
          node -e 'JSON.parse(process.argv[1])' "$config" \
            || { echo "❌ 生成的 Tauri 配置覆盖不合法：$config" >&2; exit 1; }
          echo "▶ 使用证书 $WINDOWS_CERT_THUMBPRINT 签名安装包"
          npx tauri build -c "$config" -- --locked

      - name: Collect installers with checksums
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist-windows/MenuBarHome-${version}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "../dist-windows/MenuBarHome-${version}-windows-x64.msi"
          cd ../dist-windows
          sha256sum "MenuBarHome-${version}-windows-x64-setup.exe" > "MenuBarHome-${version}-windows-x64-setup.exe.sha256"
          sha256sum "MenuBarHome-${version}-windows-x64.msi" > "MenuBarHome-${version}-windows-x64.msi.sha256"
          ls -l

      - name: Verify installer signatures
        shell: pwsh
        env:
          SIGNING_CONFIGURED: ${{ steps.authenticode.outputs.signed }}
        run: |
          $version = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'VERSION') -Raw).Trim()
          $targets = @(
            (Join-Path $env:GITHUB_WORKSPACE "dist-windows/MenuBarHome-$version-windows-x64-setup.exe"),
            (Join-Path $env:GITHUB_WORKSPACE "dist-windows/MenuBarHome-$version-windows-x64.msi")
          )
          $failed = $false
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) {
              Write-Error "缺少安装包：$target"
              $failed = $true
              continue
            }
            $signature = Get-AuthenticodeSignature -FilePath $target
            Write-Host "$target => $($signature.Status)"
            if ($env:SIGNING_CONFIGURED -eq 'true') {
              if ($signature.Status -ne 'Valid') {
                Write-Error "已配置签名证书，但 $target 的 Authenticode 状态是 $($signature.Status)（$($signature.StatusMessage)）"
                $failed = $true
              } elseif (-not $signature.TimeStamperCertificate) {
                Write-Host "::warning::$target 签名未带时间戳，证书到期后签名会失效。"
              }
            } elseif ($signature.Status -ne 'NotSigned') {
              Write-Error "未配置签名证书，但 $target 的 Authenticode 状态是 $($signature.Status)；不要把未签名包当作已签名发布。"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "### Windows Authenticode：$(if ($env:SIGNING_CONFIGURED -eq 'true') { '已签名并校验通过' } else { '未签名（明确标注，不声称已签名）' })"

      - name: Stage Windows dependency manifests for the SBOM
        # 直接扫源码树会把 node_modules 整个读一遍；只把依赖清单与安装包放进临时目录，
        # 让 SBOM 同时覆盖 npm / Cargo 依赖图和最终安装包。
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/sbom-input"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp package.json package-lock.json "$staging/"
          cp src-tauri/Cargo.toml src-tauri/Cargo.lock "$staging/"
          cp ../dist-windows/MenuBarHome-*-windows-x64-setup.exe \
            ../dist-windows/MenuBarHome-*-windows-x64.msi "$staging/"
          ls -l "$staging"

      - name: Generate Windows SBOM (SPDX 2.3)
        # 与 macOS 一致：产物统一由 stage-draft 挂到草稿（#170）。
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ runner.temp }}/sbom-input
          format: spdx-json
          output-file: dist-windows/MenuBarHome-${{ needs.verify-tag.outputs.version }}-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Windows installer build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-windows/MenuBarHome-${{ needs.verify-tag.outputs.version }}-windows-x64-setup.exe
            dist-windows/MenuBarHome-${{ needs.verify-tag.outputs.version }}-windows-x64.msi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: dist-windows/*
          if-no-files-found: error

  stage-draft:
    # 第一阶段（CI）：只把编译产物放进**未发布草稿**，到此为止。
    #
    # 为什么不自动发布（issue #17）：应用内更新用离线 Ed25519 私钥签名，私钥必须留在维护者的
    # 可信机器上。任何能从 secrets 读到私钥的 CI 都等于把“GitHub 被攻破”重新纳入密钥泄露面，
    # 所以本工作流不读取、不存储私钥，也就不具备发布未签名更新的能力。
    # 草稿缺清单签名是**预期状态**：维护者离线签名并上传后，由 finalize-release.yml 发布。
    needs: [verify-tag, macos-release, windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.verify-tag.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
      WINDOWS_SIGNED: ${{ needs.windows-release.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Re-validate tag, version, and Windows metadata
        run: bash scripts/check_release.sh tag "${RELEASE_TAG}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installers
          path: dist

      - name: Validate the 8 unsigned-draft assets
        run: bash scripts/check_release.sh draft-assets "${RELEASE_VERSION}" dist

      - name: Verify the remote tag still points at the built commit
        run: |
          set -euo pipefail
          object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type + " " + .object.sha')"
          type="${object%% *}"
          sha="${object##* }"
          if [ "$type" = "tag" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi
          if [ "$sha" != "${RELEASE_COMMIT}" ]; then
            echo "❌ 远程标签 ${RELEASE_TAG} 指向 $sha，不是本次构建的 ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          echo "✅ 远程标签 ${RELEASE_TAG} 指向 ${RELEASE_COMMIT}"

      - name: Refuse to modify an existing public release
        id: existing
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "draft_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            {
              echo "### ❌ ${RELEASE_TAG} 已有已发布的 release"
              echo "本工作流只维护草稿，绝不会向已公开的 release 追加或覆盖附件。"
              echo "请升版本号（VERSION + 三处 Windows 版本元数据）后重新打 tag。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ ${RELEASE_TAG} 已存在已发布（非 draft）的 release；拒绝修改。" >&2
            exit 1
          fi

          mapfile -t expected < <(cd dist && printf '%s\n' * | sort)
          mapfile -t actual < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | tr -d '\r' | sort)
          for name in "${actual[@]:-}"; do
            [ -n "$name" ] || continue
            case "$name" in
              "MenuBarHome-${RELEASE_VERSION}.dmg.ed25519.sig"|\
              "MenuBarHome-${RELEASE_VERSION}-windows-x64-setup.exe.ed25519.sig"|\
              "MenuBarHome-${RELEASE_VERSION}-windows-x64.msi.ed25519.sig")
                echo "❌ 草稿里还有旧的安装包签名 $name。请手动删除后再跑；本工作流不会删除 GitHub 附件。" >&2
                exit 1
                ;;
              "MenuBarHome-${RELEASE_VERSION}.update.json"|\
              "MenuBarHome-${RELEASE_VERSION}.update.json.ed25519.sig")
                continue
                ;;
            esac
            if ! printf '%s\n' "${expected[@]}" | grep -qxF -- "$name"; then
              echo "❌ 已存在的草稿 ${RELEASE_TAG} 含有本工作流不会产出的附件：$name；请人工清理后重跑。" >&2
              exit 1
            fi
          done

          echo "draft_exists=true" >> "$GITHUB_OUTPUT"
          echo "✅ 复用已存在的草稿 ${RELEASE_TAG}（只重传 8 个构建附件，不动清单和清单签名）"

      - name: Create draft release with the 8 build assets
        if: steps.existing.outputs.draft_exists == 'false'
        run: |
          set -euo pipefail
          # --verify-tag 要求 tag 已存在（本工作流从不创建 tag）；也不传 --target，避免改写 targetCommitish。
          gh release create "${RELEASE_TAG}" \
            --draft \
            --verify-tag \
            --title "MenuBarHome ${RELEASE_VERSION}" \
            --generate-notes \
            dist/*

      - name: Refresh build assets in the existing draft
        if: steps.existing.outputs.draft_exists == 'true'
        run: |
          set -euo pipefail
          # 只重传这 8 个构建附件（含两端 SBOM）。清单和清单签名不在 dist/ 里，不会被覆盖，也不会被删除。
          had_sig=false
          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | tr -d '\r' | grep -qF "MenuBarHome-${RELEASE_VERSION}.update.json.ed25519.sig"; then
            had_sig=true
          fi
          gh release upload "${RELEASE_TAG}" dist/* --clobber
          if [ "$had_sig" = "true" ]; then
            # 安装包重新构建后字节会变，旧清单里的哈希随即失效。
            {
              echo "### ⚠️ 草稿里已有更新清单签名，但本次重新上传了安装包"
              echo "请重新离线签名并覆盖 \`.update.json\` 与 \`.update.json.ed25519.sig\`，否则 Finalize Release 会失败。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::草稿已含更新清单签名，安装包被重新构建后旧清单失效；请重新离线签名。"
          fi

      - name: Verify draft assets and server-side digests
        run: |
          set -euo pipefail
          expected="$(cd dist && printf '%s\n' * | sort)"
          actual="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | tr -d '\r' | sort | grep -vE '\.ed25519\.sig$' | grep -vFx "MenuBarHome-${RELEASE_VERSION}.update.json" || true)"
          if [ "$actual" != "$expected" ]; then
            echo "❌ 草稿附件与本地构建产物不一致" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
            exit 1
          fi
          pending="$(gh release view "${RELEASE_TAG}" --json assets --jq '[.assets[] | select(.state != "uploaded")] | length')"
          if [ "$pending" != "0" ]; then
            echo "❌ 仍有 $pending 个附件未上传完成" >&2
            exit 1
          fi

          # 用 GitHub 计算的 sha256 digest 与本地文件比对，确认服务端拿到的是这次构建的字节。
          gh release view "${RELEASE_TAG}" --json assets \
            --jq '.assets[] | "\(.name) \(.digest // "none") \(.size)"' | tr -d '\r' > "$RUNNER_TEMP/remote-assets.txt"
          while read -r name digest size; do
            [ -n "$name" ] || continue
            case "$name" in
              *.ed25519.sig|"MenuBarHome-${RELEASE_VERSION}.update.json") continue ;;
            esac
            local_file="dist/${name}"
            local_size="$(wc -c < "$local_file" | tr -d '[:space:]')"
            if [ "$size" != "$local_size" ]; then
              echo "❌ ${name} 大小不一致：远端 ${size}，本地 ${local_size}" >&2
              exit 1
            fi
            if [ "$digest" = "none" ]; then
              echo "::warning::${name} 没有服务端 digest，仅校验了大小"
              continue
            fi
            local_digest="sha256:$(sha256sum "$local_file" | awk '{print $1}')"
            if [ "$digest" != "$local_digest" ]; then
              echo "❌ ${name} 的远端 digest ${digest} 与本地 ${local_digest} 不一致" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/remote-assets.txt"
          echo "✅ 草稿里的构建附件齐全且服务端摘要一致"

      - name: Sync Windows signing status in the draft notes
        run: |
          set -euo pipefail
          # 在草稿阶段就把签名状态写进发布说明，避免发布后回头改已公开内容。
          gh release view "${RELEASE_TAG}" --json body --jq '.body // ""' > "$RUNNER_TEMP/raw-notes.md"
          bash scripts/check_release.sh notes "$RUNNER_TEMP/raw-notes.md" "$RUNNER_TEMP/release-notes.md" \
            "${RELEASE_VERSION}" "${WINDOWS_SIGNED:-false}"
          if cmp -s "$RUNNER_TEMP/raw-notes.md" "$RUNNER_TEMP/release-notes.md"; then
            echo "✅ 发布说明已是正确状态，无需修改"
            exit 0
          fi
          gh release edit "${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Summarize the pending offline signature
        run: |
          set -euo pipefail
          {
            echo "### ⏳ ${RELEASE_TAG} 草稿已就绪，等待离线 Ed25519 签名"
            echo "- 提交：${RELEASE_COMMIT}"
            echo "- 草稿附件：DMG / EXE / MSI + 各自 .sha256 + 两端 SPDX SBOM（共 8 个）"
            if [ "${WINDOWS_SIGNED}" = "true" ]; then
              echo "- Windows Authenticode：已签名并校验通过"
            else
              echo "- Windows Authenticode：未签名（已在草稿说明中标注）"
            fi
            echo ""
            echo "**尚未发布**：CI 不持有更新签名私钥（issue #17）。请在可信机器上执行："
            echo '```bash'
            echo "gh release download ${RELEASE_TAG} --pattern \"MenuBarHome-${RELEASE_VERSION}*\" --dir dist"
            echo "MENUBARMIJIA_UPDATE_SIGNING_KEY=\"<离线私钥>\" swift scripts/sign_update.swift \\"
            echo "  --min-from <x.y.z> \\"
            echo "  dist/MenuBarHome-${RELEASE_VERSION}.dmg \\"
            echo "  dist/MenuBarHome-${RELEASE_VERSION}-windows-x64-setup.exe \\"
            echo "  dist/MenuBarHome-${RELEASE_VERSION}-windows-x64.msi"
            echo "gh release upload ${RELEASE_TAG} \\"
            echo "  dist/MenuBarHome-${RELEASE_VERSION}.update.json \\"
            echo "  dist/MenuBarHome-${RELEASE_VERSION}.update.json.ed25519.sig"
            echo '```'
            echo "然后运行 **Finalize Release** 工作流（tag=${RELEASE_TAG}）完成严格校验并发布。"
          } >> "$GITHUB_STEP_SUMMARY"
