name: Record snapshots

# 在基准渲染机上重写 UI 快照 PNG，并提交回指定分支。
# 基准是 macos-26-intel、Xcode 26.6、zh_CN（scripts/ci_snapshot_locale.sh）。
# 只接受本仓库已有的非默认分支。GITHUB_TOKEN 的推送不会触发 pull_request 或 push 工作流，
# workflow_dispatch 会。ci.yml 已在默认分支，因此这里直接 dispatch 它，不需要新的 PAT。
# 手动按钮要等本文件进入默认分支后才会出现在 Actions 页面。
# 换 macos-26-intel 镜像或 Xcode 钉扎后必须重跑本工作流。不要放宽 SnapshotAssertion 容差。
#
# 渲染和推送分在两台机器上。渲染机只有 contents: read，跑目标分支的测试。
# 推送机是一台新的 ubuntu，只检出默认分支的脚本，不执行目标树里的任何东西。
# 推送机只认录制机渲染时锁定的提交：录制期间分支再前进，提交脚本会失败并要求重录，
# 不会把旧像素覆盖到新提交上。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "本仓库已有的功能分支。默认分支、tag、提交号和其他仓库的分支会被拒绝。"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - name: Checkout trusted helpers from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-snapshot
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Resolve a branch of this repository
        id: branch
        env:
          BRANCH_INPUT: ${{ inputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: bash trusted-snapshot/scripts/ci_snapshot_branch.sh resolve

  record-snapshots:
    needs: resolve
    runs-on: macos-26-intel
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # 渲染所基于的分支提交。推送机只在这个提交上安装基线。
      sha: ${{ steps.recorded.outputs.sha }}
    concurrency:
      group: record-snapshots-${{ needs.resolve.outputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Check out the target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          path: snapshot-work
          persist-credentials: false
          fetch-depth: 0

      - name: Pin the commit the baselines were rendered from
        id: recorded
        run: |
          set -euo pipefail
          sha="$(git -C snapshot-work rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Baselines were rendered from ${sha}."

      # macos-26-intel ships Xcode 26.6 (17F113). Do not select latest.
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Toolchain info
        run: xcodebuild -version && swift --version && sw_vers

      - name: Restore Swift build cache
        id: swift-debug-cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: snapshot-work/.build
          key: spm-debug-v4-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            spm-debug-v4-${{ runner.os }}-${{ runner.arch }}-

      - name: Reset incomplete Swift build cache
        if: steps.swift-debug-cache.outcome != 'success'
        run: rm -rf snapshot-work/.build

      - name: Restore source mtimes for the Swift cache
        working-directory: snapshot-work
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          SNAPSHOT_RECORD: "1"
        run: bash scripts/ci_restore_mtimes.sh

      - name: Reference locale
        working-directory: snapshot-work
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          SNAPSHOT_RECORD: "1"
        run: bash scripts/ci_snapshot_locale.sh --require-xcode 26.6

      - name: Record UI snapshots
        working-directory: snapshot-work
        env:
          SWIFT_TEST_STALL_SECONDS: "300"
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          SNAPSHOT_RECORD: "1"
        run: bash scripts/record_snapshots.sh

      - name: Upload snapshot PNGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-pngs
          path: snapshot-work/Tests/MenuBarMijiaAppTests/__Snapshots__/SnapshotTests/*.png
          if-no-files-found: error

  push-snapshots:
    needs: [resolve, record-snapshots]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    concurrency:
      group: record-snapshots-${{ needs.resolve.outputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted helpers from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-snapshot
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Check out the recorded commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 录制锁定的提交，不是分支现值。分支若已前进，后面的提交脚本会拒绝并要求重录。
          ref: ${{ needs.record-snapshots.outputs.sha }}
          path: snapshot-work
          persist-credentials: false
          fetch-depth: 0

      - name: Download snapshot PNGs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: snapshot-pngs
          path: snapshot-artifact

      - name: Commit and push baseline PNGs
        id: commit
        env:
          SNAPSHOT_BRANCH: ${{ needs.resolve.outputs.branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unset GITHUB_ENV GITHUB_PATH || true
          bash "$GITHUB_WORKSPACE/trusted-snapshot/scripts/ci_snapshot_artifact.sh" install \
            "$GITHUB_WORKSPACE/snapshot-artifact" \
            "$GITHUB_WORKSPACE/snapshot-work/Tests/MenuBarMijiaAppTests/__Snapshots__/SnapshotTests"
          cd "$GITHUB_WORKSPACE/snapshot-work"
          unset GITHUB_TOKEN
          gh auth setup-git
          bash "$GITHUB_WORKSPACE/trusted-snapshot/scripts/ci_commit_snapshot_baselines.sh" commit

      - name: Dispatch CI for the new baselines
        if: steps.commit.outputs.pushed == 'true'
        env:
          SNAPSHOT_BRANCH: ${{ needs.resolve.outputs.branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本步在 workspace 根（trusted-snapshot / snapshot-work 所在目录，不是 Git 仓库）执行，
          # 不设 GH_REPO 时 gh 无法推断仓库，会报 fatal: not a git repository。
          gh workflow run ci.yml --repo "$GH_REPO" --ref "$SNAPSHOT_BRANCH"
          echo "Dispatched CI on ${SNAPSHOT_BRANCH}."
          echo "A GITHUB_TOKEN push does not start pull_request workflows. workflow_dispatch does."
          echo "ci.yml is already on the default branch, so this does not need a new PAT."

      - name: Re-run Snapshot Guard for the open pull request
        if: steps.commit.outputs.pushed == 'true'
        env:
          SNAPSHOT_BRANCH: ${{ needs.resolve.outputs.branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GH_REPO" --head "$SNAPSHOT_BRANCH" --state open \
              --json number --jq 'if length > 0 then .[0].number else "" end')"
          if [ -z "$pr" ]; then
            echo "${SNAPSHOT_BRANCH} 没有关联的开放 PR，PR 检查无需重评。"
            exit 0
          fi
          # GITHUB_TOKEN 推送不会触发 pull_request 工作流，所以 PR 上的
          # snapshot-baselines 检查要靠这里手动派发 snapshot-guard.yml 重评。
          gh workflow run snapshot-guard.yml --repo "$GH_REPO" -f pr="$pr"
          echo "Dispatched Snapshot Guard for PR ${pr}."
          echo "guard 自己用 PR API 解析 head/base，在 PR 当前头提交上重跑基线检查。"
