name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限。actions: write 只用于 Actions cache（Swift .build / npm / Rust），
# 不授予 contents: write。需要写仓库的发布流程在单独的 release 工作流里。
permissions:
  contents: read
  actions: write

# PR 上连续推送只保留最新一次。main 的每一次提交都要跑完（发版依赖这条），不取消。
# main 按 sha 分组：同组里排队的运行即使 cancel-in-progress 为 false 也会被更新的推送顶掉。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # 按改动范围分流：文档-only 跳过全部重型任务；只改单一平台时跳过另一平台。
    # 工作流本身仍会运行：被 if 跳过的 job 在 GitHub 上记为成功，
    # 这样 path filter 不会把 required check 卡在 Pending。
    # 见 https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks#handling-skipped-but-required-checks
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide which CI surfaces changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full_ci() {
            printf 'code=true\nmacos=true\nwindows=true\ncore=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            full_ci
            echo "workflow_dispatch always runs full CI"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              full_ci
              echo "new branch; running full CI"
              exit 0
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            full_ci
            echo "could not resolve ${base}..${head}; running full CI"
            exit 0
          fi
          # --no-renames：一次跨目录移动会同时列出旧路径和新路径，避免漏掉旧平台。
          git diff --name-only --no-renames "$base" "$head" > "$RUNNER_TEMP/changed.txt"
          scope="$(bash scripts/ci_relevant_paths.sh < "$RUNNER_TEMP/changed.txt")"
          # 脚本输出异常时按全量 CI 处理，避免格式错误被误判成 docs-only 而跳过检查。
          for key in code macos windows core; do
            if ! printf '%s\n' "$scope" | grep -Eq "^${key}=(true|false)$"; then
              full_ci
              echo "unexpected scope output; running full CI"
              printf '%s\n' "$scope"
              cat "$RUNNER_TEMP/changed.txt"
              exit 0
            fi
          done
          printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$scope" | grep -q '^code=true$'; then
            echo "code changed; running the affected CI surfaces"
          else
            echo "docs-only change; heavy jobs skipped"
            cat "$RUNNER_TEMP/changed.txt"
          fi

  nas-safety:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: bash scripts/install_ripgrep.sh
      - name: Secret, coding-standard, and design-token checks
        # 这些检查与操作系统无关，放在 Ubuntu 上，避免占用 macOS 配额。
        # swift:6.1 容器里没有 python3，设计令牌和公钥一致性以前只在 macOS 上跑。
        run: bash scripts/check.sh --lint-only
      - name: MIoT coverage report
        run: |
          { echo '```'; python3 scripts/miot_coverage_report.py; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Test NAS deployment safety
        run: bash scripts/test_nas_setup.sh

  linux-core:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.core == 'true'
    # 验证 MijiaCore 全量单测（Ubuntu + Swift 6.1）。密钥与编码规范在 nas-safety 里跑。
    # 只在核心库或其共享语料变更时运行；macos-test 仍覆盖同一批 MijiaCoreTests。
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the Linux build cache
        id: linux-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/linux-check/.build
            scripts/linux-check/.work
          # 列出具体文件：.build 和 .work 恢复后不能算进哈希。
          key: linux-core-v1-${{ hashFiles('scripts/linux-check/Package.swift', 'scripts/linux-check/Package.resolved', 'scripts/linux-check/run.sh', 'scripts/linux-check/Shims/**') }}-${{ github.sha }}
          restore-keys: |
            linux-core-v1-${{ hashFiles('scripts/linux-check/Package.swift', 'scripts/linux-check/Package.resolved', 'scripts/linux-check/run.sh', 'scripts/linux-check/Shims/**') }}-
      - name: Pin shim mtimes for the Swift cache
        # checkout 把 mtime 设成当前时间，Shims 是 MijiaCore 的依赖，会连带全量重编。
        # 这些文件的内容已进缓存 key，内容变了就换缓存，固定时间戳不会用到旧产物。
        run: find scripts/linux-check/Shims scripts/linux-check/Package.swift scripts/linux-check/Package.resolved -type f -exec touch -d @1577836800 {} +
      - name: Test MijiaCore on Linux
        run: bash scripts/linux-check/run.sh
      - name: Trim the Linux build cache
        if: success() && github.ref == 'refs/heads/main'
        run: find scripts/linux-check/.build -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Save the Linux build cache
        if: success() && github.ref == 'refs/heads/main' && steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/linux-check/.build
            scripts/linux-check/.work
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

  raycast:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 不放 macOS：这些测试不依赖系统，macOS 并发额度留给 Swift。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - name: Test and typecheck the Raycast extension
        run: npm ci --no-audit --no-fund && npm test && npm run typecheck

  windows-core:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    # 验证 Windows 版 TypeScript 核心测试与前端打包
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install & Test & Build Frontend
        run: npm ci && npm test && npm run build

  windows-camera-bin:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    # 构建安装包内置的 go2rtc 与最小 LGPL ffmpeg；结果由 windows-installer 消费。
    uses: ./.github/workflows/camera-bin.yml

  windows-rust-test:
    needs: [changes, windows-camera-bin]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    # 从安装包 job 拆出来并行：debug 和 release 是两套产物，串在一台机器上只是把时间相加。
    # tauri_build 会校验 camera-bin/* 资源存在，所以这里同样要下载内置组件。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "windows/src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend & Tauri CLI dependencies
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: camera-bin
          path: windows/src-tauri/camera-bin
      - name: Build the frontend that tauri::generate_context! embeds
        run: npm run build
      - name: Test native URL and credential policies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-installer:
    needs: [changes, windows-camera-bin]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    # 安装包依赖 windows-camera-bin 的内置组件；前端测试由 windows-core 覆盖，
    # cargo test 在 windows-rust-test。前端由 tauri 的 beforeBuildCommand 构建。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "windows/src-tauri -> target"
          # 和 release.yml 共用一份 release 产物；tag 读得到 main 的缓存，反过来不行。
          shared-key: windows-release-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read the Tauri CLI version for the tools cache key
        id: tauri-cli
        shell: bash
        # package-lock.json only: the key follows the CLI that downloads the bundler tools, not the
        # rest of the dependency tree.
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@tauri-apps/cli'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Tauri downloads NSIS 3.13 and WiX 3.14 from GitHub Releases on every cold run (~125 MB
      # extracted) and answers 504 outages with `failed to bundle project: http status: 504`.
      # Cache both toolsets; the key only moves when the CLI version does. Save on main only, like
      # linux-core, so PR runs do not fill the 10 GB Actions cache.
      - name: Restore the Tauri bundler tools cache
        id: tauri-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-v1-${{ runner.os }}-${{ steps.tauri-cli.outputs.version }}
      - name: Install frontend & Tauri CLI dependencies
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: camera-bin
          path: windows/src-tauri/camera-bin
      - name: Build Windows Tauri installer (.exe & .msi)
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Save the Tauri bundler tools cache
        if: success() && github.ref == 'refs/heads/main' && steps.tauri-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\tauri
          key: ${{ steps.tauri-tools-cache.outputs.cache-primary-key }}
      - name: Collect Windows installers
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist-windows/MenuBarHome-${version}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "../dist-windows/MenuBarHome-${version}-windows-x64.msi"
          cd ../dist-windows
          sha256sum "MenuBarHome-${version}-windows-x64-setup.exe" > "MenuBarHome-${version}-windows-x64-setup.exe.sha256"
          sha256sum "MenuBarHome-${version}-windows-x64.msi" > "MenuBarHome-${version}-windows-x64.msi.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MenuBarHome-Windows-x64
          path: dist-windows/*

  macos-test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    # 全部 Swift 单测（快照比对留在宿主机门禁）。三个 macOS job 里只有这个可以排到本地隔离 VM：
    # VM 单任务串行，三个都排过去时一次运行占用约 20 分钟，后面的 PR 全在排队。
    # Empty MACOS_CI_RUNNER keeps GitHub-hosted macOS; the local option is an isolated VM.
    runs-on: ${{ fromJSON(vars.MACOS_CI_RUNNER || '"macos-26"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # macos-26 on 2026-11-09 printed Xcode 26.6 (17F113). Do not select latest.
      - name: Select Xcode 26.6
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Toolchain info
        run: xcodebuild -version && swift --version
      # 只有 main 写缓存：key 带 sha，PR 也写的话一次运行 370 MB，很快撑满仓库的 10 GB。
      - id: swift-debug-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # v3 discards caches built while merge commits were not stamped.
          key: spm-debug-v3-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            spm-debug-v3-${{ runner.os }}-
      - name: Restore source mtimes for the Swift cache
        run: bash scripts/ci_restore_mtimes.sh
      - name: Match the maintainer's region
        # 温度单位跟随系统区域。托管机默认美国区（华氏度），测试和黄金语料的基准是中国区。
        run: |
          defaults write -g AppleLocale zh_CN
          defaults write -g AppleMetricUnits -bool true
          defaults write -g AppleMeasurementUnits Centimeters
          defaults write -g AppleTemperatureUnit Celsius
      - name: Swift tests
        env:
          # A deadlocked test samples its stacks and fails here instead of burning the 45-minute
          # job timeout in silence.
          SWIFT_TEST_STALL_SECONDS: "300"
        # 快照基线以维护者的 Mac 为准，托管机渲染不同；快照比对在本机 scripts/check.sh 里跑。
        run: bash scripts/ci_swift_test.sh --skip SnapshotTests
      - name: Trim Swift build cache
        if: success() && github.ref == 'refs/heads/main'
        run: |
          find .build -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
          du -sh .build 2>/dev/null || true
      - name: Save Swift build cache
        if: success() && github.ref == 'refs/heads/main' && steps.swift-debug-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift-debug-cache.outputs.cache-primary-key }}

  macos-appintents:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    # xcodebuild 提取 App Intents。和 swift test 串在一台 3 核机器上时，冷启动会把两者相加。
    # 固定在托管机，与本地 VM 上的 macos-test 并行，不读 MACOS_CI_RUNNER。
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # macos-26 on 2026-11-09 printed Xcode 26.6 (17F113). Do not select latest.
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - id: appintents-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived
          # v2 discards derived data the local VM built with its own Xcode.
          key: appintents-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            appintents-v2-${{ runner.os }}-
      - name: Restore source mtimes for the Xcode cache
        run: bash scripts/ci_restore_mtimes.sh
      - name: App Intents metadata
        run: APP_INTENTS_ONLY=1 bash scripts/build_app.sh
      - name: Trim Xcode derived data
        if: success() && github.ref == 'refs/heads/main'
        run: |
          find .derived -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -f .derived/appintents-build.log
          du -sh .derived 2>/dev/null || true
      - name: Save Xcode derived data
        if: success() && github.ref == 'refs/heads/main' && steps.appintents-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived
          key: ${{ steps.appintents-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: appintents-log
          path: .derived/appintents-build.log
          if-no-files-found: ignore

  macos-release:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    # Release -O 通用二进制（#2 这类崩溃只在 -O 下出现）以及符号表路径泄露检查。
    # 固定在托管机，与本地 VM 上的 macos-test 并行，不读 MACOS_CI_RUNNER。
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # macos-26 on 2026-11-09 printed Xcode 26.6 (17F113). Do not select latest.
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Toolchain info
        run: xcodebuild -version && swift --version
      - id: swift-release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # v3 discards caches the local VM built with its own Xcode.
          key: spm-release-v3-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            spm-release-v3-${{ runner.os }}-
      - name: Restore source mtimes for the Swift cache
        run: bash scripts/ci_restore_mtimes.sh
      - id: go2rtc-ptz-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/go2rtc-ptz/out
          key: go2rtc-ptz-v1-${{ runner.os }}-${{ hashFiles('scripts/go2rtc-ptz/patches/0001-xiaomi-ptz.patch', 'scripts/go2rtc-ptz/build.sh') }}
      - name: Build app (release universal)
        env:
          SKIP_APP_INTENTS: "1"
        run: bash scripts/build_app.sh
      - name: Save patched go2rtc cache
        if: success() && github.ref == 'refs/heads/main' && steps.go2rtc-ptz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/go2rtc-ptz/out
          key: ${{ steps.go2rtc-ptz-cache.outputs.cache-primary-key }}
      - name: Trim Swift build cache
        if: success() && github.ref == 'refs/heads/main'
        run: |
          find .build -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -f .build/appintents-build.log
          du -sh .build 2>/dev/null || true
      - name: Save Swift build cache
        if: success() && github.ref == 'refs/heads/main' && steps.swift-release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift-release-cache.outputs.cache-primary-key }}

  macos:
    # 历史 required check 的名字。文档-only 或只改 Windows 时三个 macOS job 被跳过，这里仍成功，
    # 避免 path filter 把 `CI / macos` 卡在 Pending。任一应有的 macOS job 失败则这里失败。
    needs: [changes, macos-test, macos-release, macos-appintents]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require macOS tests and the release build
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          MACOS: ${{ needs.changes.outputs.macos }}
          TESTS: ${{ needs.macos-test.result }}
          RELEASE: ${{ needs.macos-release.result }}
          INTENTS: ${{ needs.macos-appintents.result }}
        run: >-
          bash scripts/ci_require_jobs.sh
          "macos-test:$TESTS:$MACOS"
          "macos-release:$RELEASE:$MACOS"
          "macos-appintents:$INTENTS:$MACOS"

  ci:
    # 始终运行的汇总检查。文档-only 或未受影响的平台任务被跳过时，这里成功；
    # 任何一个实际失败（不是预期跳过）则失败。适合作为唯一的 required check。
    needs: [changes, nas-safety, linux-core, raycast, windows-core, windows-camera-bin, windows-rust-test, windows-installer, macos-test, macos-release, macos-appintents]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail the workflow unless every required job succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          MACOS: ${{ needs.changes.outputs.macos }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
          CORE: ${{ needs.changes.outputs.core }}
          NAS: ${{ needs.nas-safety.result }}
          LINUX: ${{ needs.linux-core.result }}
          RAYCAST: ${{ needs.raycast.result }}
          WINDOWS_CORE: ${{ needs.windows-core.result }}
          WINDOWS_CAMERA: ${{ needs.windows-camera-bin.result }}
          WINDOWS_RUST_TEST: ${{ needs.windows-rust-test.result }}
          WINDOWS_INSTALLER: ${{ needs.windows-installer.result }}
          MACOS_TEST: ${{ needs.macos-test.result }}
          MACOS_RELEASE: ${{ needs.macos-release.result }}
          MACOS_INTENTS: ${{ needs.macos-appintents.result }}
        run: >-
          bash scripts/ci_require_jobs.sh
          "nas-safety:$NAS:always"
          "linux-core:$LINUX:$CORE"
          "raycast:$RAYCAST:always"
          "windows-core:$WINDOWS_CORE:$WINDOWS"
          "windows-camera-bin:$WINDOWS_CAMERA:$WINDOWS"
          "windows-rust-test:$WINDOWS_RUST_TEST:$WINDOWS"
          "windows-installer:$WINDOWS_INSTALLER:$WINDOWS"
          "macos-test:$MACOS_TEST:$MACOS"
          "macos-release:$MACOS_RELEASE:$MACOS"
          "macos-appintents:$MACOS_INTENTS:$MACOS"
