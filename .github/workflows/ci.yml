name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      macos: ${{ steps.filter.outputs.macos }}
      windows: ${{ steps.filter.outputs.windows }}
      core: ${{ steps.filter.outputs.core }}
      raycast: ${{ steps.filter.outputs.raycast }}
      scripts: ${{ steps.filter.outputs.scripts }}
      website: ${{ steps.filter.outputs.website }}
      macos_build: ${{ steps.filter.outputs.macos_build }}
      appintents: ${{ steps.filter.outputs.appintents }}
      windows_native: ${{ steps.filter.outputs.windows_native }}
      nas: ${{ steps.filter.outputs.nas }}
      go2rtc: ${{ steps.filter.outputs.go2rtc }}
      tv_bridge: ${{ steps.filter.outputs.tv_bridge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Decide which CI surfaces changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full_ci() {
            printf 'code=true\nmacos=true\nwindows=true\ncore=true\nraycast=true\nscripts=true\nwebsite=true\nmacos_build=true\nappintents=true\nwindows_native=true\nnas=true\ngo2rtc=true\ntv_bridge=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" = "refs/heads/main" ]; then
              full_ci
              echo "workflow_dispatch on main always runs full CI"
              exit 0
            fi
            git fetch --no-tags --depth=50 origin main 2>/dev/null || true
            if ! base="$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null)" || [ -z "$base" ]; then
              full_ci
              echo "could not resolve merge-base with origin/main; running full CI"
              exit 0
            fi
            head="$HEAD_SHA"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              full_ci
              echo "new branch; running full CI"
              exit 0
            fi
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "$base" 2>/dev/null || true
          fi
          if ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=50 origin "$head" 2>/dev/null || true
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            full_ci
            echo "could not resolve ${base}..${head}; running full CI"
            exit 0
          fi
          git diff --name-only --no-renames "$base" "$head" > "$RUNNER_TEMP/changed.txt"
          scope="$(bash scripts/ci_relevant_paths.sh < "$RUNNER_TEMP/changed.txt")"
          for key in code macos windows core raycast scripts website macos_build appintents windows_native nas go2rtc tv_bridge; do
            if ! printf '%s\n' "$scope" | grep -Eq "^${key}=(true|false)$"; then
              full_ci
              echo "unexpected scope output; running full CI"
              printf '%s\n' "$scope"
              cat "$RUNNER_TEMP/changed.txt"
              exit 0
            fi
          done
          printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$scope" | grep -q '^code=true$'; then
            echo "code changed; running the affected CI surfaces"
          else
            echo "docs-only change; heavy jobs skipped"
            cat "$RUNNER_TEMP/changed.txt"
          fi

  nas-safety:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: bash scripts/install_ripgrep.sh
      - name: Secret, coding-standard, capability-matrix, and script checks
        run: |
          if [ "${{ needs.changes.outputs.scripts }}" = "true" ]; then
            bash scripts/check.sh --lint-only --script-tests
          else
            bash scripts/check.sh --lint-only
            python3 scripts/check_doc_links.py
            python3 scripts/check_capability_matrix.py
            python3 scripts/check_capability_manifest.py
            python3 scripts/check_adapter_protocol.py
            python3 scripts/check_tv_catalog.py
            python3 scripts/check_supported_devices.py
          fi
      - name: Test NAS deployment safety
        if: needs.changes.outputs.nas == 'true' || needs.changes.outputs.scripts == 'true'
        run: bash scripts/test_nas_setup.sh

  linux-core:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the Linux build cache
        id: linux-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/linux-check/.build
            scripts/linux-check/.work
          key: linux-core-v2-${{ hashFiles('scripts/linux-check/Package.swift', 'scripts/linux-check/Package.resolved', 'scripts/linux-check/run.sh', 'scripts/linux-check/Shims/**') }}
          restore-keys: |
            linux-core-v2-
      - name: Pin shim mtimes for the Swift cache
        run: find scripts/linux-check/Shims scripts/linux-check/Package.swift scripts/linux-check/Package.resolved -type f -exec touch -d @1577836800 {} +
      - name: Test MijiaCore on Linux
        run: bash scripts/linux-check/run.sh
      - name: Trim the Linux build cache
        if: success() && github.ref == 'refs/heads/main'
        run: find scripts/linux-check/.build -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
      - name: Save the Linux build cache
        if: success() && github.ref == 'refs/heads/main' && steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/linux-check/.build
            scripts/linux-check/.work
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

  raycast:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.raycast == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - name: Test and typecheck the Raycast extension
        run: npm ci --no-audit --no-fund && npm test && npm run typecheck

  website:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Typecheck and build website
        run: npm ci --prefix website && npm --prefix website run typecheck && npm --prefix website run build

  go2rtc-test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.go2rtc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Go 1.26.10 toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/menubarmijia/go1.26.10
          key: go2rtc-go-1.26.10-${{ runner.os }}-${{ runner.arch }}
      - name: Verify go2rtc PTZ patch and Go unit tests
        run: |
          bash scripts/go2rtc-ptz/build.sh --go-only
          bash scripts/go2rtc-ptz/verify.sh

  tv-bridge-test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tv_bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Go 1.26.10 toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/menubarmijia/go1.26.10
          key: go2rtc-go-1.26.10-${{ runner.os }}-${{ runner.arch }}
      - name: Test and cross-check mbh-tv-bridge Go adapter
        run: |
          bash scripts/go2rtc-ptz/build.sh --go-only
          GO_BIN="$(bash scripts/go2rtc-ptz/go_ready.sh)"
          cd adapters/mbh-tv-bridge
          "$GO_BIN" test -race ./...
          sh ./build.sh --check

  windows-core:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install & Test & Build Frontend
        run: npm ci && npm test && npm run build

  windows-camera-bin:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.windows_native == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/camera-bin.yml

  windows-rust-test:
    needs: [changes, windows-camera-bin]
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.windows_native == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "windows/src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: camera-bin
          path: windows/src-tauri/camera-bin
      - name: Prepare frontend dist stub for tauri::generate_context!
        shell: bash
        run: mkdir -p dist && cp index.html dist/index.html
      - name: Test native URL and credential policies
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-installer:
    needs: [changes, windows-camera-bin]
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.windows_native == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "windows/src-tauri -> target"
          shared-key: windows-release-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Read the Tauri CLI version for the tools cache key
        id: tauri-cli
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package-lock.json').packages['node_modules/@tauri-apps/cli'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the Tauri bundler tools cache
        id: tauri-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-v1-${{ runner.os }}-${{ steps.tauri-cli.outputs.version }}
      - name: Install frontend & Tauri CLI dependencies
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: camera-bin
          path: windows/src-tauri/camera-bin
      - name: Build Windows Tauri installer (.exe & .msi)
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Save the Tauri bundler tools cache
        if: success() && github.ref == 'refs/heads/main' && steps.tauri-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\tauri
          key: ${{ steps.tauri-tools-cache.outputs.cache-primary-key }}
      - name: Collect Windows installers
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < ../VERSION)"
          mkdir -p ../dist-windows
          cp src-tauri/target/release/bundle/nsis/*.exe "../dist-windows/MenuBarHome-${version}-windows-x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "../dist-windows/MenuBarHome-${version}-windows-x64.msi"
          cd ../dist-windows
          sha256sum "MenuBarHome-${version}-windows-x64-setup.exe" > "MenuBarHome-${version}-windows-x64-setup.exe.sha256"
          sha256sum "MenuBarHome-${version}-windows-x64.msi" > "MenuBarHome-${version}-windows-x64.msi.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MenuBarHome-Windows-x64
          path: dist-windows/*

  macos-test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Toolchain info
        run: xcodebuild -version && swift --version && sw_vers
      - name: Restore Swift build cache
        id: swift-debug-cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-debug-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-debug-v5-${{ runner.os }}-${{ runner.arch }}-
      - name: Reset incomplete Swift build cache
        if: steps.swift-debug-cache.outcome != 'success'
        run: rm -rf .build
      - name: Restore source mtimes for the Swift cache
        run: bash scripts/ci_restore_mtimes.sh
      - name: Reference locale
        id: reference-locale
        run: |
          defaults write -g AppleLocale zh_CN
          defaults write -g AppleMetricUnits -bool true
          defaults write -g AppleMeasurementUnits Centimeters
          defaults write -g AppleTemperatureUnit Celsius
      - name: Swift unit tests
        id: unit-tests
        env:
          SWIFT_TEST_STALL_SECONDS: "300"
        run: bash scripts/ci_swift_test.sh --skip SnapshotTests
      - name: Compare UI snapshots
        id: snapshot-tests
        if: always() && !cancelled() && steps.reference-locale.outcome == 'success'
        env:
          SWIFT_TEST_STALL_SECONDS: "300"
          SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshot-failures
        run: bash scripts/ci_swift_test.sh --filter SnapshotTests
      - name: Upload snapshot mismatches
        if: always() && !cancelled() && steps.snapshot-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-failures
          path: ${{ runner.temp }}/snapshot-failures
          if-no-files-found: ignore
      - name: Trim Swift build cache
        if: success() && github.ref == 'refs/heads/main'
        run: |
          find .build -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
          du -sh .build 2>/dev/null || true
      - name: Save Swift build cache
        if: success() && github.ref == 'refs/heads/main' && steps.swift-debug-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift-debug-cache.outputs.cache-primary-key }}
      - name: Verify combined macOS test verdict
        if: always() && !cancelled() && steps.reference-locale.outcome == 'success'
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot-tests.outcome }}
        run: |
          set -euo pipefail
          echo "unit-tests=${UNIT_OUTCOME} snapshot-tests=${SNAPSHOT_OUTCOME}"
          if [ "${UNIT_OUTCOME}" != "success" ] || [ "${SNAPSHOT_OUTCOME}" != "success" ]; then
            exit 1
          fi

  macos-appintents:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.appintents == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - id: appintents-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived
          key: appintents-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            appintents-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore source mtimes for the Xcode cache
        run: bash scripts/ci_restore_mtimes.sh
      - name: App Intents metadata
        run: APP_INTENTS_ONLY=1 APP_INTENTS_CONFIGURATION=Debug bash scripts/build_app.sh
      - name: Trim Xcode derived data
        if: success() && github.ref == 'refs/heads/main'
        run: |
          find .derived -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -f .derived/appintents-build.log
          du -sh .derived 2>/dev/null || true
      - name: Save Xcode derived data
        if: success() && github.ref == 'refs/heads/main' && steps.appintents-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived
          key: ${{ steps.appintents-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: appintents-log
          path: .derived/appintents-build.log
          if-no-files-found: ignore

  macos-release:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (needs.changes.outputs.macos_build == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26-intel
    # A Package.swift change misses the cache key and invalidates the release build plan, so the
    # whole of MijiaCore recompiles with -O. That cold build needs more than the 30 minutes a warm
    # cache takes (#404 hit the cap while still compiling MijiaCore).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"
      - name: Toolchain info
        run: xcodebuild -version && swift --version
      - name: Restore Swift build cache
        id: swift-release-cache
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-release-v5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-release-v5-${{ runner.os }}-${{ runner.arch }}-
      - name: Reset incomplete Swift build cache
        if: steps.swift-release-cache.outcome != 'success'
        run: rm -rf .build
      - name: Restore source mtimes for the Swift cache
        run: bash scripts/ci_restore_mtimes.sh
      - id: go2rtc-ptz-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/go2rtc-ptz/out
          key: go2rtc-ptz-v1-${{ runner.os }}-${{ hashFiles('scripts/go2rtc-ptz/patches/0001-xiaomi-ptz.patch', 'scripts/go2rtc-ptz/build.sh') }}
      - name: Build app (release native)
        env:
          ARCHS: native
          SKIP_APP_INTENTS: "1"
        run: bash scripts/build_app.sh
      - name: Save patched go2rtc cache
        if: success() && github.ref == 'refs/heads/main' && steps.go2rtc-ptz-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/go2rtc-ptz/out
          key: ${{ steps.go2rtc-ptz-cache.outputs.cache-primary-key }}
      - name: Trim Swift build cache
        if: success() && github.ref == 'refs/heads/main'
        run: |
          find .build -type d \( -name ModuleCache -o -name Index.noindex \) -prune -exec rm -rf {} + 2>/dev/null || true
          rm -f .build/appintents-build.log
          du -sh .build 2>/dev/null || true
      - name: Save Swift build cache
        if: success() && github.ref == 'refs/heads/main' && steps.swift-release-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift-release-cache.outputs.cache-primary-key }}

  ci:
    needs: [changes, nas-safety, linux-core, raycast, website, go2rtc-test, tv-bridge-test, windows-core, windows-camera-bin, windows-rust-test, windows-installer, macos-test, macos-release, macos-appintents]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail the workflow unless every required job succeeded
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          MACOS: ${{ needs.changes.outputs.macos }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
          CORE: ${{ needs.changes.outputs.core }}
          RAYCAST: ${{ needs.changes.outputs.raycast }}
          WEBSITE: ${{ needs.changes.outputs.website }}
          GO2RTC: ${{ needs.changes.outputs.go2rtc }}
          TV_BRIDGE: ${{ needs.changes.outputs.tv_bridge }}
          NAS: ${{ needs.nas-safety.result }}
          LINUX: ${{ needs.linux-core.result }}
          RAYCAST_RES: ${{ needs.raycast.result }}
          WEBSITE_RES: ${{ needs.website.result }}
          GO2RTC_TEST: ${{ needs.go2rtc-test.result }}
          TV_BRIDGE_TEST: ${{ needs.tv-bridge-test.result }}
          WINDOWS_CORE: ${{ needs.windows-core.result }}
          WINDOWS_CAMERA: ${{ needs.windows-camera-bin.result }}
          WINDOWS_RUST_TEST: ${{ needs.windows-rust-test.result }}
          WINDOWS_INSTALLER: ${{ needs.windows-installer.result }}
          MACOS_TEST: ${{ needs.macos-test.result }}
          MACOS_RELEASE: ${{ needs.macos-release.result }}
          MACOS_INTENTS: ${{ needs.macos-appintents.result }}
          WINDOWS_NATIVE_ACTIVE: ${{ (needs.changes.outputs.windows_native == 'true' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          MACOS_BUILD_ACTIVE: ${{ (needs.changes.outputs.macos_build == 'true' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          APPINTENTS_ACTIVE: ${{ (needs.changes.outputs.appintents == 'true' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${CHANGES:-}" != "success" ]; then
            echo "❌ changes=${CHANGES:-<unset>}"
            exit 1
          fi
          strict=0
          [ "${CODE:-}" = "true" ] && strict=1
          fail=0
          check_job() {
            local name="$1" result="$2" relevant="${3:-always}"
            case "$result" in
              success) echo "✅ $name success" ;;
              skipped)
                if [ "$strict" -eq 1 ] && [ "$relevant" = "true" ] || { [ "$strict" -eq 1 ] && [ "$relevant" = "always" ]; }; then
                  echo "❌ $name skipped while required"
                  fail=1
                else
                  echo "✅ $name skipped (not affected)"
                fi
                ;;
              *)
                echo "❌ $name ${result:-<empty>}"
                fail=1
                ;;
            esac
          }
          check_job "nas-safety" "$NAS" "always"
          check_job "linux-core" "$LINUX" "$CORE"
          check_job "raycast" "$RAYCAST_RES" "$RAYCAST"
          check_job "website" "$WEBSITE_RES" "$WEBSITE"
          check_job "go2rtc-test" "$GO2RTC_TEST" "$GO2RTC"
          check_job "tv-bridge-test" "$TV_BRIDGE_TEST" "$TV_BRIDGE"
          check_job "windows-core" "$WINDOWS_CORE" "$WINDOWS"
          check_job "windows-camera-bin" "$WINDOWS_CAMERA" "$WINDOWS_NATIVE_ACTIVE"
          check_job "windows-rust-test" "$WINDOWS_RUST_TEST" "$WINDOWS_NATIVE_ACTIVE"
          check_job "windows-installer" "$WINDOWS_INSTALLER" "$WINDOWS_NATIVE_ACTIVE"
          check_job "macos-test" "$MACOS_TEST" "$MACOS"
          check_job "macos-release" "$MACOS_RELEASE" "$MACOS_BUILD_ACTIVE"
          check_job "macos-appintents" "$MACOS_INTENTS" "$APPINTENTS_ACTIVE"
          exit "$fail"
