<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>MenuBarHome 界面原型</title>
<style>
:root{
  color-scheme:light;
  --bg:#ECEDEF;--surface:#FFFFFF;--surface-2:#F5F5F7;--sunken:#E6E7EA;
  --line:rgba(24,24,32,.1);--line-strong:rgba(24,24,32,.2);
  --fg:#1B1B20;--fg-2:#4F5059;--fg-3:#62636C;
  --accent:#0A62D0;--accent-fg:#FFFFFF;--accent-soft:#E4EEFB;
  --on:#A84A08;--on-soft:#FFF0E0;--on-line:rgba(200,100,20,.28);
  --ok:#12733F;--warn:#854305;--warn-soft:#FCF0D9;--warn-line:rgba(150,90,10,.28);
  --danger:#AE2318;--danger-soft:#FCE8E5;--danger-line:rgba(174,35,24,.28);
  --track:#C4C5CC;--knob:#FFFFFF;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 12px 32px rgba(20,20,30,.1);
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#131316;--surface:#1E1E23;--surface-2:#27272D;--sunken:#0E0E11;
  --line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.22);
  --fg:#F2F2F5;--fg-2:#C4C5CE;--fg-3:#A9AAB4;
  --accent:#74B5FF;--accent-fg:#06233F;--accent-soft:#1B3048;
  --on:#FFB877;--on-soft:#3A2A1C;--on-line:rgba(255,184,119,.3);
  --ok:#62D595;--warn:#F8C55A;--warn-soft:#382C14;--warn-line:rgba(248,197,90,.3);
  --danger:#FF9C92;--danger-soft:#42201D;--danger-line:rgba(255,156,146,.32);
  --track:#55565F;--knob:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.42);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131316;--surface:#1E1E23;--surface-2:#27272D;--sunken:#0E0E11;
  --line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.22);
  --fg:#F2F2F5;--fg-2:#C4C5CE;--fg-3:#A9AAB4;
  --accent:#74B5FF;--accent-fg:#06233F;--accent-soft:#1B3048;
  --on:#FFB877;--on-soft:#3A2A1C;--on-line:rgba(255,184,119,.3);
  --ok:#62D595;--warn:#F8C55A;--warn-soft:#382C14;--warn-line:rgba(248,197,90,.3);
  --danger:#FF9C92;--danger-soft:#42201D;--danger-line:rgba(255,156,146,.32);
  --track:#55565F;--knob:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow-wrap:anywhere}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[data-focus-h]:focus-visible{outline:none}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 原型外壳 */
.proto{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.proto-id{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;min-width:0}
.proto-id b{font-size:13px;font-weight:600}
.badge-demo{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 9px}
.proto-nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;min-width:0;justify-content:center}
.proto-nav button{padding:5px 10px;border-radius:7px;color:var(--fg-2);font-weight:500;transition:background-color .15s ease,color .15s ease,transform .12s ease-out}
.proto-nav button[aria-current="page"]{background:var(--sunken);color:var(--fg)}
.proto-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage{max-width:1180px;margin:0 auto;padding:22px 16px 72px}

/* 通用控件 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;max-width:100%;min-height:30px;padding:5px 12px;border-radius:8px;font-weight:500;background:var(--surface-2);border:1px solid var(--line);transition:background-color .15s ease,border-color .15s ease,transform .12s ease-out}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{background:var(--danger);color:var(--surface);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.big{min-height:36px;padding:7px 18px;font-size:14px}
.btn:disabled{opacity:.55}
.btn:not(:disabled):active,.icon-btn:active,.proto-nav button:active,.seg button:active,.chip:active,.tile-main:active,.tile-more:active,.side-nav button:active,.plat:active{transform:scale(.97)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;color:var(--fg-2);transition:background-color .15s ease,transform .12s ease-out}
.link{color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:2px;border-radius:4px}
.link .ic{width:12px;height:12px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunken);border-radius:8px;padding:2px;gap:2px;max-width:100%}
.seg button{padding:3px 10px;min-height:26px;border-radius:6px;color:var(--fg-2);font-weight:500;transition:background-color .15s ease,color .15s ease,transform .12s ease-out}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg .n{color:var(--fg-3);font-weight:400;margin-left:3px}
.sw{position:relative;flex:none;width:38px;height:22px;border-radius:999px;background:var(--track);transition:background-color .2s ease,transform .12s ease-out}
.sw i{position:absolute;top:2px;left:2px;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .22s var(--ease);color:#55565F}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(16px)}
.sw[aria-disabled="true"]{background:var(--track);cursor:not-allowed}
.sw[aria-disabled="true"][aria-checked="true"]{background:color-mix(in srgb,var(--accent) 45%,var(--track))}
.sw i .ic{width:10px;height:10px;stroke-width:2.2}
.sw:active{transform:scale(.96)}
input[type=text],input[type=password],input[type=search],select{width:100%;min-height:32px;padding:5px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);transition:border-color .15s ease}
input:focus-visible,select:focus-visible{outline-offset:0}
input[aria-invalid="true"]{border-color:var(--danger)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:22px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;color:var(--fg-2);background:var(--surface-2);border-radius:999px;padding:1px 8px;line-height:1.5}
.pill.ok{color:var(--ok)}
.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.danger{color:var(--danger);background:var(--danger-soft)}
.pill .ic{width:11px;height:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.hollow{background:none;border:1.5px solid var(--fg-3)}
.status-x{color:var(--danger);font-weight:700;line-height:1}
.note{display:flex;gap:8px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;background:var(--surface-2);color:var(--fg)}
.note>.ic{margin-top:2px;color:var(--fg-2)}
.note.warn{background:var(--warn-soft)}.note.warn>.ic,.note.warn b{color:var(--warn)}
.note.danger{background:var(--danger-soft)}.note.danger>.ic,.note.danger b{color:var(--danger)}
.note.info{background:var(--accent-soft)}.note.info>.ic{color:var(--accent)}
.note b{font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions.end{justify-content:flex-end}
.muted{color:var(--fg-2)}
.small{font-size:12px}
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border:1px dashed var(--line-strong);border-radius:10px;font-size:12px;color:var(--fg-2)}
.sim b{font-weight:500}

/* 引导 */
.onb{max-width:560px;margin:0 auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px 20px}
.onb-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.onb-steps{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2)}
.onb-bar{display:flex;gap:4px}
.onb-bar i{width:22px;height:3px;border-radius:2px;background:var(--sunken);transition:background-color .2s ease}
.onb-bar i.on{background:var(--accent)}
.onb h1{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.onb .lead{color:var(--fg-2);margin:6px 0 16px;font-size:13.5px}
.onb-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.plats{display:grid;gap:8px}
.plat{position:relative;display:grid;grid-template-columns:36px 1fr 18px;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);cursor:pointer;transition:border-color .15s ease,background-color .15s ease,transform .12s ease-out}
.plat:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.plat:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.plat input{position:absolute;opacity:0;width:1px;height:1px}
.plat .mi{width:36px;height:36px;border-radius:10px}
.plat b{display:block;font-weight:600;font-size:14px}
.plat span.d{color:var(--fg-2);font-size:12.5px}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);display:block;transition:border-width .15s ease,border-color .15s ease}
.plat:has(input:checked) .radio{border:5px solid var(--accent)}
.qr-wrap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px;align-items:start}
.qr{position:relative;width:160px;height:160px;background:#fff;color:#16161A;border-radius:12px;border:1px solid var(--line);padding:10px}
.qr svg{display:block;width:100%;height:100%}
.qr.dim svg{opacity:.14}
.qr-tag{position:absolute;inset:auto 0 -1px;text-align:center}
.qr-over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12.5px;color:#16161A;padding:12px}
.qr-over button{background:#16161A;color:#fff;border-radius:8px;padding:5px 10px;font-weight:500}
.steps{display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:18px 1fr;gap:8px;color:var(--fg-3)}
.steps li.now{color:var(--fg);font-weight:500}
.steps li.done{color:var(--fg-2)}
.steps .mk{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);font-size:11px}
.steps li.now .mk{border-color:var(--accent);color:var(--accent)}
.steps li.done .mk{background:var(--ok);border-color:transparent;color:var(--surface)}
.steps .mk .ic{width:11px;height:11px;stroke-width:2.6}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:grid;gap:4px;margin-top:12px}
.field label{font-weight:500}
.field .hint{font-size:12px;color:var(--fg-2)}
.field .err{font-size:12.5px;color:var(--danger)}
.key-row{display:flex;gap:6px}
.found{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);flex-wrap:wrap}
.found div{flex:1 1 180px;min-width:0}
.found b{font-weight:600;display:block}
.howto{margin-top:8px;font-size:12.5px;color:var(--fg-2)}
.howto ol{list-style:decimal;padding-left:18px;margin-top:4px;display:grid;gap:2px}
.errbox{margin-top:12px;display:grid;gap:8px;padding:12px;border-radius:10px;background:var(--danger-soft);color:var(--fg);font-size:12.5px}
.errbox b{display:block;font-weight:600;color:var(--danger);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--fg-2);transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .12s ease-out}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--fg);font-weight:500}
.chip .n{color:var(--fg-2);font-weight:400;font-size:12px}
.sec-label{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600;margin:16px 0 8px}
.tight-list{border-radius:12px;background:var(--surface-2);padding:2px 12px}
.tight-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tight-row:last-child{border-bottom:0}
.tight-row div{min-width:0}
.tight-row small{display:block;color:var(--fg-2);font-size:12px}
.mark-done{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
.mark-done .ic{width:22px;height:22px}
.tips{display:grid;gap:8px;margin-top:14px}
.tips li{display:flex;gap:8px;color:var(--fg-2)}
.tips .ic{margin-top:2px}

/* 面板 */
.panel-stage{display:grid;grid-template-columns:minmax(0,380px) minmax(0,270px);gap:24px;justify-content:center;align-items:start}
.panel{width:100%;max-height:660px;display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.p-head{display:flex;align-items:center;gap:6px;padding:12px 10px 8px 14px}
.p-title{flex:1;min-width:0}
.p-title b{font-size:15px;font-weight:600;display:block;line-height:1.25}
.p-title span{font-size:12px;color:var(--fg-2)}
.p-alerts{display:grid;gap:6px;padding:0 10px 8px}
.urgent{background:var(--danger-soft);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.urgent b{display:flex;align-items:center;gap:6px;color:var(--danger);font-weight:600;font-size:14px}
.urgent p{font-size:12.5px}
.capsule{display:flex;align-items:center;gap:6px;min-height:32px;border-radius:999px;background:var(--surface-2);padding:2px 4px 2px 10px;font-size:12.5px}
.capsule.danger{background:var(--danger-soft);color:var(--danger)}
.capsule.warn{background:var(--warn-soft);color:var(--warn)}
.capsule .ic{width:14px;height:14px}
.capsule .t{flex:1;min-width:0;line-height:1.3}
.capsule button.act{font-weight:600;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:2px;flex:none}
.capsule .icon-btn{width:24px;height:24px;border-radius:50%}
.rem-list{background:var(--surface-2);border-radius:12px;padding:2px 12px}
.rem-list li{padding:7px 0;border-bottom:1px solid var(--line)}
.rem-list li:last-child{border:0}
.rem-list small{display:block;color:var(--fg-2);font-size:12px}
.p-search{padding:0 10px 8px;display:flex;gap:6px;align-items:center}
.rooms{display:flex;gap:2px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.rooms::-webkit-scrollbar{display:none}
.rooms button{flex:none;padding:3px 10px;min-height:26px;border-radius:999px;color:var(--fg-2);font-weight:500;transition:background-color .15s ease,color .15s ease}
.rooms button[aria-pressed="true"]{background:var(--sunken);color:var(--fg)}
.p-body{flex:1 1 auto;min-height:120px;overflow-y:auto;padding:2px 10px 10px;border-top:1px solid var(--line)}
.p-group{font-size:12px;color:var(--fg-2);margin:8px 2px 6px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--surface-2);border-radius:11px;transition:background-color .18s ease}
.tile.on{background:var(--on-soft)}
.tile.open,.tile.confirming{grid-column:1/-1}
.tile.off-line .tile-main{opacity:.72}
.tile-main{display:flex;align-items:center;gap:7px;min-width:0;padding:7px 2px 7px 7px;border-radius:11px;transition:transform .12s ease-out}
div.tile-main{cursor:default}
.ti{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--surface);color:var(--fg-2);flex:none;transition:color .18s ease}
.tile.on .ti{color:var(--on)}
.tt{min-width:0}
.tt b{display:block;font-weight:500;line-height:1.25}
.tt small{display:block;font-size:12px;color:var(--fg-2);line-height:1.3}
.tile.on .tt small{color:var(--on)}
.tile-more{display:grid;place-items:center;width:26px;align-self:stretch;color:var(--fg-3);border-radius:0 11px 11px 0;transition:transform .12s ease-out}
.tile-more .ic{width:13px;height:13px;transition:transform .18s var(--ease)}
.tile-more[aria-expanded="true"] .ic{transform:rotate(90deg)}
.drawer{grid-column:1/-1;display:grid;gap:8px;padding:2px 10px 10px;font-size:12.5px;transition:opacity .18s ease;opacity:1}
.fade-in{transition:opacity .16s ease;opacity:1}
@starting-style{.drawer,.preview,.toast,.fade-in{opacity:0}}
.drawer label{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center}
.drawer output{text-align:right;color:var(--fg-2)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:20px;font-weight:600;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.stepper button{width:30px;height:30px;border-radius:8px;background:var(--surface);display:grid;place-items:center}
.cam{aspect-ratio:16/9;border-radius:8px;background:linear-gradient(160deg,#30323A,#191A1F);color:#E9E9EE;display:grid;place-items:center;font-size:12.5px}
.confirm-text{color:var(--fg);font-size:12.5px}
.confirm-text b{font-weight:600}
.p-foot{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-top:1px solid var(--line);min-height:44px}
.p-state{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2);border-radius:6px}
.p-foot-col{display:grid;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.p-foot-col p{font-size:12.5px}
.p-foot-col p.q{font-size:13px;font-weight:600}
.p-empty{display:grid;gap:8px;justify-items:center;text-align:center;padding:28px 12px;color:var(--fg-2)}
.p-empty b{color:var(--fg);font-size:14px;font-weight:600}
.side{display:grid;gap:14px;font-size:12.5px}
.side-card{background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.side-card h2{font-size:13px;font-weight:600}
.side-card .row{display:grid;gap:5px}
.side-card ul{display:grid;gap:6px;color:var(--fg-2)}

/* 设置窗口 */
.win{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;height:min(800px,calc(100vh - 104px));min-height:560px}
.stage:has(>.win){padding-bottom:20px}
.win-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;flex:1 1 180px;color:var(--fg-2);min-width:0;flex-wrap:wrap}
.crumb button{color:var(--fg-2);border-radius:4px}
.crumb b{color:var(--fg);font-weight:600}
.crumb .sep{color:var(--fg-3)}
.win-search{position:relative;flex:0 1 260px;min-width:0}
.win-search .ic{position:absolute;left:9px;top:8px;color:var(--fg-3);pointer-events:none}
.win-search input{padding-left:30px;padding-right:30px;background:var(--surface-2);border-color:var(--line)}
.win-search .icon-btn{position:absolute;right:2px;top:1px}
.win-body{flex:1;display:grid;grid-template-columns:188px minmax(0,1fr);min-height:0}
.side-nav{background:var(--surface-2);padding:10px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:auto}
.side-nav button{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--fg-2);font-weight:500;transition:background-color .15s ease,color .15s ease,transform .12s ease-out}
.side-nav button[aria-current="page"]{background:var(--sunken);color:var(--fg)}
.win-main{overflow-y:auto;padding:20px 24px 40px;min-width:0}
.page{max-width:680px;margin:0 auto}
.page.wide{max-width:none}
.page-h{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.page-lead{color:var(--fg-2);margin:4px 0 16px;font-size:13px}
.group-h{display:flex;align-items:center;gap:6px;font-weight:600;margin:20px 0 6px;font-size:13px}
.group-h .n{font-weight:400;color:var(--fg-2)}
.sub-h{font-size:12px;font-weight:500;color:var(--fg-2);margin:12px 2px 6px}
.card{background:var(--surface-2);border-radius:12px;padding:0 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 0;min-height:44px;border-bottom:1px solid var(--line);flex-wrap:wrap;scroll-margin:80px}
.card>:last-child{border-bottom:0}
.set-l{flex:1 1 110px;min-width:0}
.set-l small{display:block;color:var(--fg-2);font-size:12px}
.set-c{display:flex;align-items:center;gap:8px;max-width:100%;min-width:0}
.set-c select{width:auto;max-width:100%}
.set-c input[type=text]{width:180px;max-width:100%}
.full{flex:1 1 100%;min-width:0}
.disc{display:flex;align-items:center;gap:4px;padding:10px 2px;color:var(--fg-2);font-weight:500;border-radius:6px}
.disc .ic{width:13px;height:13px;transition:transform .18s var(--ease)}
.disc[aria-expanded="true"] .ic{transform:rotate(90deg)}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,55%{background-color:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}100%{background-color:transparent;box-shadow:0 0 0 6px transparent}}
.mrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:2px 12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);scroll-margin:80px;border-radius:2px}
.card>.mrow:last-child{border-bottom:0}
.mi{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--surface);color:var(--fg-2)}
.mt{min-width:0}
.mn{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;font-weight:600}
.mt p{color:var(--fg-2);font-size:12.5px;line-height:1.4;margin-top:1px}
.mc{display:flex;align-items:center;gap:10px;min-height:32px}
.mrow.is-off .mn{font-weight:500}
.mrow.is-off .mi{background:none;box-shadow:inset 0 0 0 1px var(--line)}
.lock-why{display:flex;gap:5px;margin-top:4px;font-size:12.5px;color:var(--warn);align-items:flex-start}
.lock-why .link{margin-left:4px}
.lock-why .ic{width:13px;height:13px;margin-top:2px}
.mx{grid-column:1/-1;margin-top:8px;min-width:0}
.preview{display:grid;gap:9px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line-strong);font-size:12.5px;transition:opacity .16s ease;opacity:1}
.preview h3{font-size:13px;font-weight:600}
.preview .impact{display:grid;gap:3px}
.preview .impact>b{font-weight:600}
.preview ul{display:grid;gap:3px}
.preview li{display:flex;gap:6px;align-items:baseline}
.tag{flex:none;font-size:12px;color:var(--fg-2)}
.subs{display:grid;gap:0;padding:0 12px;border-radius:10px;background:var(--surface)}
.subs>*{border-bottom:1px solid var(--line)}
.subs>:last-child{border-bottom:0}
.rule{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:8px 0}
.rule small{display:block;color:var(--fg-2);font-size:12px}
.rule.paused>div:first-child{color:var(--fg-2)}
.more-row{display:flex;align-items:center;gap:4px;padding:9px 0;color:var(--fg-2);font-weight:500;width:100%}
.more-row .ic{width:13px;height:13px}
.results{display:grid;gap:14px}
.res{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line)}
.card>.res:last-child{border-bottom:0}
.res .rt{flex:1;min-width:0}
.res small{display:block;color:var(--fg-2);font-size:12px}
.res mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:36px 16px;text-align:center;color:var(--fg-2);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--fg);font-size:14px;font-weight:600}
.conn-card{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.cmp-col{min-width:0}
.cmp-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:8px}
.status-head{display:flex;align-items:center;gap:12px;padding:12px 0 14px}
.status-head .mi{width:40px;height:40px;border-radius:11px;background:var(--surface-2)}
.status-head h2{font-size:16px;font-weight:600;line-height:1.3}
.status-head p{display:flex;align-items:center;gap:6px;color:var(--fg-2);font-size:12.5px;flex-wrap:wrap}
.advanced{margin-top:2px}
.advanced .card{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--fg-2)}
.danger-zone{margin-top:14px;display:grid;gap:8px}
.text-danger{color:var(--danger);font-weight:500}
.toast-wrap{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:440px;padding:8px 10px 8px 14px;border-radius:12px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow);font-size:13px;transition:opacity .16s ease;opacity:1}
.toast button{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px;flex:none;padding:2px 4px;border-radius:4px}
.toast :focus-visible{outline-color:var(--bg)}

@media (hover:hover) and (pointer:fine){
  .proto-nav button:hover,.icon-btn:hover,.side-nav button:hover,.rooms button:hover{background:var(--sunken)}
  .btn:not(.primary):not(.danger):not(:disabled):hover{background:var(--sunken)}
  .btn.ghost:hover{background:var(--accent-soft)!important}
  .btn.primary:not(:disabled):hover,.btn.danger:hover{filter:brightness(1.08)}
  .tile:not(.on):hover{background:var(--sunken)}
  .link:hover{text-decoration:underline}
  .res:hover .rt>span:first-child{color:var(--accent)}
  .plat:hover{border-color:var(--fg-3)}
}
@media (max-width:760px){
  .proto{position:static}
  .proto-nav{justify-content:flex-start;order:3;flex-basis:100%}
  .panel-stage{grid-template-columns:minmax(0,380px)}
  .win{height:auto;min-height:0;overflow:visible}
  .win-body{grid-template-columns:minmax(0,1fr)}
  .win-search{flex:1 1 100%}
  .side-nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side-nav button{padding:5px 9px}
  .win-main{overflow:visible;padding:16px 14px 28px}
}
@media (max-width:460px){
  .stage{padding:14px 12px 72px}
  .onb{padding:16px}
  .qr-wrap{grid-template-columns:minmax(0,1fr)}
  .qr{margin:0 auto}
  .mrow{grid-template-columns:28px minmax(0,1fr) auto;gap:2px 8px}
  .mrow>.mi{width:28px;height:28px}
}
.btn.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.hold::after{content:"";position:absolute;inset:0;background:currentColor;opacity:.16;transform:scaleX(0);transform-origin:left;pointer-events:none}
.btn.hold.is-holding::after{transform:scaleX(1);transition:transform .6s linear}
@media (prefers-reduced-motion:reduce){.btn.hold.is-holding::after{transition:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-property:opacity,background-color,border-color,color!important;transition-duration:.12s!important;scroll-behavior:auto!important}
  .btn:active,.icon-btn:active,.seg button:active,.chip:active,.tile-main:active,.tile-more:active,.sw:active,.plat:active,.proto-nav button:active,.side-nav button:active,.tile-more:active{transform:none!important}
  .sw i{transition:none!important}
  .spin{animation:pulse 1.6s ease-in-out infinite;border-color:var(--accent)}
  @keyframes pulse{50%{opacity:.35}}
}
@media (prefers-contrast:more){:root{--line:rgba(120,120,130,.55);--line-strong:rgba(120,120,130,.9)}}

/* ---------- 影响分析 ---------- */
function affected(kind,id){
  const out={rules:[],feats:[],safetyLost:[],devices:0};
  if(kind==='type'){
    out.rules=RULES.filter(r=>r.t===id&&ruleActive(r));
    out.feats=FEATURES.filter(f=>f.needs===id&&S.feats[f.id]);
    out.devices=typeDevices(id).length;
  }else if(kind==='conn'){
    out.rules=RULES.filter(r=>ruleSrc(r)===id&&ruleActive(r));
    out.devices=connDevices(id).length;
    out.safetyLost=Object.values(ALERTS).filter(a=>S.alerts[a.dev]&&srcOf(D(a.dev))===id);
  }else if(kind==='feature'&&id==='automation'){
    out.rules=RULES.filter(ruleActive);
  }
  return out;
}
const hasImpact=a=>a.rules.length||a.feats.length||a.safetyLost.length;
function snapshot(){return JSON.stringify({conn:S.conn,types:S.types,feats:S.feats,paused:S.paused,demo:S.demo,single:S.single});}
function restore(j){Object.assign(S,JSON.parse(j));}
function tagFor(kind,id){return kind+':'+id;}
function allLinked(kind,id){return kind==='type'?RULES.filter(r=>r.t===id):kind==='conn'?RULES.filter(r=>ruleSrc(r)===id):kind==='feature'&&id==='automation'?RULES:[];}
function pauseRules(list,tag){list.forEach(r=>{if(!S.paused[r.id].includes(tag))S.paused[r.id].push(tag)});}
function resume(tag){let n=0;for(const r of RULES){const b=S.paused[r.id].length;S.paused[r.id]=S.paused[r.id].filter(t=>t!==tag);if(b&&!S.paused[r.id].length)n++;}return n;}
function pauseReason(r){const t=S.paused[r.id][0]||'';const[k,i]=t.split(':');
  if(k==='type')return{txt:`「${T(i).name}」已关闭`,a:'enableType',id:i,btn:`开启${T(i).name}`};
  if(k==='conn')return{txt:`「${CONNS[i].name}」${S.conn[i]==='none'?'已移除':'已停用'}`,a:S.conn[i]==='none'?'connectStart':'resumeConn',id:i,btn:S.conn[i]==='none'?'重新连接':'恢复连接'};
  if(k==='feature')return{txt:'定时与自动化已关闭',a:'enableFeature',id:i,btn:'开启'};
  return{txt:'已暂停',a:'',id:''};}
function typeName(kind,id){return kind==='type'?T(id).name:kind==='conn'?CONNS[id].name:F(id).name;}

function doClose(kind,id){
  const snap=snapshot(),a=affected(kind,id),name=typeName(kind,id),tag=tagFor(kind,id);
  pauseRules(allLinked(kind,id),tag);
  if(kind==='type')S.types[id]=false;
  if(kind==='conn')S.conn[id]='paused';
  if(kind==='feature')S.feats[id]=false;
  S.preview=null;
  const n=a.rules.length+a.feats.length;
  toast(kind==='conn'?`已停用「${name}」，登录信息已保留${n?`，${n} 项已暂停`:''}`:`已关闭「${name}」${n?`，${n} 项已暂停`:'，设置已保留'}`,()=>{restore(snap);toast(`已恢复「${name}」`);});
}
function doOpen(kind,id){
  const tag=tagFor(kind,id);
  if(kind==='type')S.types[id]=true;
  if(kind==='conn'){S.conn[id]='on';S.demo=false;}
  if(kind==='feature')S.feats[id]=true;
  const n=resume(tag);S.recover=null;
  toast(`已开启「${typeName(kind,id)}」${n?`，${n} 项已恢复`:''}`);
}
function requestClose(kind,id,el){
  const a=affected(kind,id);
  const isSafetyType=kind==='type'&&T(id).safety;
  if(!hasImpact(a)&&!isSafetyType){flipRender(()=>doClose(kind,id));return;}
  S.preview={kind,id,mode:'close',from:el?.dataset.fk};S.focusNext='[data-fk="pv-cancel"]';render();
  qs('.preview')?.scrollIntoView({block:'nearest'});
}
function previewHTML(){
  const p=S.preview;
  if(p.kind==='alert'){const a=ALERTS[p.id];return `<div class="preview" role="group" aria-label="确认关闭${a.name}"><h3>确定关闭「${a.name}」？</h3><p>${a.off}手机上的通知不受影响。</p><p>关闭后，面板顶部会一直显示这项提醒已关闭，直到你重新开启。</p><div class="actions end"><button class="btn" data-a="pvCancel" data-fk="pv-cancel">保持开启</button><button class="btn danger" data-a="alertOff" data-id="${p.id}" data-fk="pv-ok">仍要关闭</button></div></div>`;}
  if(p.mode==='remove')return removeHTML(p.id);
  const a=affected(p.kind,p.id),name=typeName(p.kind,p.id);
  const verb=p.kind==='conn'?'停用':'关闭';
  let lead=p.kind==='type'?`面板里不再显示这 ${a.devices} 台设备，它们的设置都会保留。`:p.kind==='conn'?`来自这里的 ${a.devices} 台设备会从面板收起。登录信息会保留，随时可以重新启用。`:'所有定时和自动化都会停下来，规则本身会保留。';
  let body=`<h3>${verb}「${esc(name)}」后</h3><p>${lead}</p>`;
  if(a.rules.length)body+=`<div class="impact"><b>这些在用的项会暂停</b><ul>${a.rules.map(r=>`<li><span class="tag">${r.kind}</span><span>${esc(r.name)}</span></li>`).join('')}</ul></div>`;
  if(a.feats.length)body+=`<div class="impact"><b>这些功能会等它重新开启</b><ul>${a.feats.map(f=>`<li><span class="tag">功能</span><span>${esc(f.name)}</span></li>`).join('')}</ul></div>`;
  if(a.safetyLost.length)body+=`<div class="note danger">${ic('warn')}<div><b>${uniqJoin(a.safetyLost.map(s=>s.name))}将收不到。</b>这些报警器由「${esc(name)}」连接，停用后这台电脑不会收到报警。面板顶部会一直提示，直到你恢复。</div></div>`;
  if(p.kind==='type'&&T(p.id).safety)body+=`<div class="note info">${ic('shield')}<div><b>安全提醒不会跟着关闭。</b>这里只是不在面板显示设备，发生报警时仍会置顶提醒你。要停止提醒，需到「安全与提醒」单独关闭并确认。</div></div>`;
  if(p.kind==='type'&&T(p.id).risky)body+=`<p>重新开启后，车库门每次动作前仍然要你确认。</p>`;
  const ok=hasImpact(a)?'暂停这些项并关闭':'只隐藏这些设备';
  body+=`<div class="actions end"><button class="btn" data-a="pvCancel" data-fk="pv-cancel">取消</button><button class="btn primary" data-a="pvConfirm" data-fk="pv-ok">${ok}</button></div>`;
  return `<div class="preview" role="group" aria-label="${verb}${esc(name)}前的确认">${body}</div>`;
}
function removeHTML(id){

function qrSVG(){let s=7,p='';const n=25;const finder=(x,y)=>`M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5zM${x+2} ${y+2}h3v3h-3z`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;s=(s*73+41)%1021;if(s%5<2)p+=`M${x} ${y}h1v1h-1z`;}
  return `<svg viewBox="0 0 25 25" role="img" aria-label="示例二维码，不能真实扫描"><path fill="currentColor" fill-rule="evenodd" d="${finder(0,0)}${finder(18,0)}${finder(0,18)}${p}"/></svg>`;}

function runSearch(q){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);

function morphKids(a,b){
  const keyed=new Map();for(const c of a.children)if(c.dataset&&c.dataset.k)keyed.set(c.dataset.k,c);
  let cur=a.firstChild;
  for(const n of [...b.childNodes]){
    const key=n.nodeType===1?n.dataset.k:null;let m=null;
    if(key){const h=keyed.get(key);if(h&&h.nodeName===n.nodeName)m=h;}
    else if(cur&&cur.nodeType===n.nodeType&&cur.nodeName===n.nodeName&&!(cur.dataset&&cur.dataset.k))m=cur;
    if(m){if(m===cur)cur=cur.nextSibling;else a.insertBefore(m,cur);morph(m,n);}
    else a.insertBefore(n,cur);
  }
  while(cur){const nx=cur.nextSibling;a.removeChild(cur);cur=nx;}
}
function morph(a,b){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  if(a.nodeName==='INPUT'){if(a.type==='checkbox'||a.type==='radio')a.checked=b.hasAttribute('checked');else{const v=b.getAttribute('value')??'';if(a.value!==v)a.value=v;}return;}
  morphKids(a,b);
  if(a.nodeName==='SELECT'){const o=[...b.options].find(x=>x.hasAttribute('selected'));if(o)a.value=o.value;}
}

/* ---------- 事件 ---------- */
let holdTimer=null;
function holdEnd(){clearTimeout(holdTimer);holdTimer=null;document.querySelectorAll('.btn.hold.is-holding').forEach(b=>b.classList.remove('is-holding'));}

function onField(e){

  else if(i==='haUrl'){S.onb.ha.url=v;S.onb.ha.urlErr='';if(S.onb.ha.status==='failed')S.onb.ha.status='idle';}
  else if(i==='haKey'){S.onb.ha.key=v;S.onb.ha.keyErr='';if(S.onb.ha.status==='failed')S.onb.ha.status='idle';}
