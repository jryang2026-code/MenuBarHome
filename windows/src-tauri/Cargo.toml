[package]
name = "menubarmijia-windows"
version = "1.2.0"
description = "MenuBarHome for Windows 11 System Tray"
authors = ["jryang1997"]
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
tokio = { version = "1", features = ["time"] }
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# Windows Credential Manager for tokens and API keys (#28).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Native backdrop (§1.4): the DWM system-backdrop attribute and the two registry reads that decide
# whether this machine may have one. 0.59 is already in Cargo.lock through tauri, so no second copy.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
