<!doctype html>
<html lang="en" data-type="software" class="scheme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <meta name="theme-color" content="#f6f2eb" />
    <meta name="color-scheme" content="light" />
    <title>MenuBarHome — Smart-home control in your menu bar and tray</title>
    <meta
      name="description"
      content="MenuBarHome v1.4.0 puts your Mi Home and Home Assistant lights, curtains, AC, plugs, and cameras one keystroke away on macOS 14+ and Windows 11. MIT open source."
    />
    <link rel="canonical" href="https://jryang2026-code.github.io/MenuBarHome/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MenuBarHome" />
    <meta property="og:url" content="https://jryang2026-code.github.io/MenuBarHome/" />
    <meta property="og:title" content="MenuBarHome — Smart-home control in your menu bar and tray" />
    <meta
      property="og:description"
      content="Control Mi Home and Home Assistant devices directly from the macOS menu bar or Windows 11 tray. Local-first, MIT open source."
    />
    <meta property="og:image" content="https://jryang2026-code.github.io/MenuBarHome/media/hero-poster.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./media/logo-dark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./media/app-icon-32.png" />
    <link rel="apple-touch-icon" href="./media/app-icon-256.png" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/instrument-serif-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/instrument-serif-latin-400-italic.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="./media/hero-poster-mobile.webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="./media/hero-poster.webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />
    <script>
      try {
        var p = new URLSearchParams(location.search).get('lang');
        var l = p ? (/^zh(?:\b|[-_])/i.test(p) ? 'zh' : /^en(?:\b|[-_])/i.test(p) ? 'en' : '') : '';
        if (!l) { var s = localStorage.getItem('mbh_locale_v1'); if (s === 'zh' || s === 'en') l = s; }
        if (!l) {
          var arr = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
          for (var i = 0; i < arr.length; i++) {
            if (/^zh(?:\b|[-_])/i.test(arr[i])) { l = 'zh'; break; }
            if (/^en(?:\b|[-_])/i.test(arr[i])) { l = 'en'; break; }
          }
        }
        if (l === 'zh') document.documentElement.lang = 'zh-CN';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#f6f2eb] text-[#1e1a16] antialiased selection:bg-[#d97706]/20 selection:text-[#1e1a16]">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
